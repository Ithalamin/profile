<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST_VAULT | AUTO_SYNC</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg: #000; --fg: #fff; --card: #0a0a0a; --border: #222; --green: #00ff00; --accent: #444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--fg); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; height: 100dvh; overflow: hidden; }

        .container { width: 100%; max-width: 650px; background: var(--card); border-left: 1px solid var(--border); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: relative; }
        header { padding: 15px 20px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #000; }
        .logo { font-size: 0.85rem; font-weight: 900; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }

        #vault-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .status-line { font-size: 0.6rem; color: var(--accent); padding: 8px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; background: #050505; }

        /* Message Bubbles */
        .msg-card { border-left: 2px solid var(--green); padding: 12px; background: rgba(255,255,255,0.02); border-radius: 2px; max-width: 90%; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }
        .msg-text { font-size: 0.9rem; line-height: 1.5; color: #ddd; word-break: break-all; }
        .msg-meta { font-size: 0.6rem; color: var(--accent); margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
        .del-btn { color: #ff3333; cursor: pointer; border: 1px solid rgba(255,51,51,0.2); padding: 1px 5px; border-radius: 2px; }

        /* Fixed Footer Input */
        .input-vault { padding: 12px; border-top: 1px solid var(--border); background: #000; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: #111; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 4px; outline: none; font-size: 16px; }
        input[type="text"]:focus { border-color: var(--green); }
        .btn-icon { background: var(--fg); color: var(--bg); border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; }
        input[type="file"] { display: none; }
        
        a { color: var(--green); text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo"><i data-lucide="shield-check" color="#00ff00" size="18"></i> GHOST_VAULT</div>
        <div id="sync-indicator"><i data-lucide="refresh-cw" size="14" color="#00ff00"></i></div>
    </header>

    <div class="status-line">
        <span><i data-lucide="activity" size="10"></i> AJX_AUTO_SYNC: <span id="conn-text" style="color:var(--green)">ACTIVE</span></span>
        <span id="room-tag">/ROOT/SX/V</span>
    </div>

    <div id="vault-messages"></div>

    <div class="input-vault">
        <div class="input-row">
            <label class="btn-icon">
                <i data-lucide="plus" size="20"></i>
                <input type="file" id="fileInput" onchange="sendFile()">
            </label>
            <input type="text" id="msgInput" placeholder="Write to vault..." autocomplete="off">
            <button class="btn-icon" onclick="sendMsg()"><i data-lucide="arrow-up" size="20"></i></button>
        </div>
    </div>
</div>

<script>
    // 🛡️ Pro Config
    const CHANNEL = "ghost_vault_root_sx_vfinal"; 
    const PASS = "ROOT_SX_SECURE_BYPASS_99"; 
    let lastMsgId = ""; // ট্র্যাক করার জন্য যে কোন মেসেজটি লাস্ট এসেছে

    async function getCryptoKey() {
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(PASS));
        return await crypto.subtle.importKey('raw', hash, 'AES-GCM', false, ['encrypt', 'decrypt']);
    }

    async function crypt(content, isEnc = true) {
        const key = await getCryptoKey();
        if (isEnc) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const enc = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(content));
            return btoa(JSON.stringify({iv: Array.from(iv), data: Array.from(new Uint8Array(enc))}));
        } else {
            const {iv, data} = JSON.parse(atob(content));
            const dec = await crypto.subtle.decrypt({name: 'AES-GCM', iv: new Uint8Array(iv)}, key, new Uint8Array(data));
            return new TextDecoder().decode(dec);
        }
    }

    // 🔄 AJAX Auto-Sync Logic (Recursive Fetch)
    async function autoSync() {
        try {
            // fetch with ?poll=1 loads last messages instantly
            const response = await fetch(`https://ntfy.sh/${CHANNEL}/json?poll=1`);
            const data = await response.text();
            const lines = data.trim().split('\n');

            for (const line of lines) {
                if (!line) continue;
                const pkg = JSON.parse(line);
                if (pkg.event === 'message') {
                    const dec = await crypt(pkg.message, false).catch(() => null);
                    if (dec) {
                        if (dec.startsWith("DEL:")) {
                            document.getElementById(dec.split(":")[1])?.remove();
                        } else {
                            render(dec, pkg.id);
                        }
                    }
                }
            }
        } catch (e) { console.log("Sync Interrupted..."); }
        
        // প্রতি ৩ সেকেন্ড পর পর অটো চেক করবে (Battery & Data efficient)
        setTimeout(autoSync, 3000);
    }

    function render(text, id) {
        if (document.getElementById(id)) return;
        const msgBox = document.getElementById('vault-messages');
        const div = document.createElement('div');
        div.className = 'msg-card';
        div.id = id;

        let body = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
        if (text.startsWith("FILE:")) {
            const [name, b64] = text.replace("FILE:", "").split("|");
            body = `📎 <a href="${b64}" download="${name}">${name}</a>`;
        }

        div.innerHTML = `<div class="msg-text">${body}</div><div class="msg-meta"><span>${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span><span class="del-btn" onclick="kill('${id}')">BURN</span></div>`;
        msgBox.appendChild(div);
        msgBox.scrollTop = msgBox.scrollHeight;
        lucide.createIcons();
    }

    async function sendMsg() {
        const input = document.getElementById('msgInput');
        if (!input.value) return;
        const encrypted = await crypt(input.value);
        input.value = ""; // মেসেজ পাঠানোর সাথে সাথে ইনপুট ক্লিয়ার (Pro Look)
        await fetch(`https://ntfy.sh/${CHANNEL}`, { method: 'POST', body: encrypted });
        autoSync(); // পাঠানোর সাথে সাথে একবার সিঙ্ক ট্রিগার করা
    }

    async function sendFile() {
        const file = document.getElementById('fileInput').files[0];
        if (!file || file.size > 250000) return alert("Limit: 250KB");
        const reader = new FileReader();
        reader.onload = async (e) => {
            const encrypted = await crypt(`FILE:${file.name}|${e.target.result}`);
            await fetch(`https://ntfy.sh/${CHANNEL}`, { method: 'POST', body: encrypted });
            autoSync();
        };
        reader.readAsDataURL(file);
    }

    async function kill(id) {
        const encrypted = await crypt(`DEL:${id}`);
        await fetch(`https://ntfy.sh/${CHANNEL}`, { method: 'POST', body: encrypted });
        document.getElementById(id)?.remove();
    }

    document.getElementById('msgInput').addEventListener('keypress', (e) => e.key === 'Enter' && sendMsg());
    
    // Start the engine
    window.onload = () => {
        lucide.createIcons();
        autoSync(); 
    };
</script>
</body>
</html>
