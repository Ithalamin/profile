<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VAULT_X_V9_MONO</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* --- High Contrast Monochrome Theme --- */
        :root { 
            --bg: #000000; 
            --fg: #ffffff; 
            --dim: #666666;
            --brd: #222222; 
            --accent: #ffffff;
            --danger: #ff0000;
        }

        * { 
            box-sizing: border-box; 
            outline: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background: var(--bg); 
            color: var(--fg); 
            font-family: 'JetBrains Mono', 'Courier New', monospace; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            height: 100dvh; 
            overflow: hidden; 
        }

        /* --- Framework Layout --- */
        .vault-frame { 
            width: 100%; 
            max-width: 500px; 
            border-left: 1px solid var(--brd); 
            border-right: 1px solid var(--brd); 
            display: flex; 
            flex-direction: column; 
            background: var(--bg); 
        }

        header { 
            padding: 15px 20px; 
            border-bottom: 1px solid var(--brd); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 11px; 
            letter-spacing: 3px; 
            text-transform: uppercase;
        }

        /* --- Message Engine UI --- */
        #ch-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            scrollbar-width: none;
        }
        #ch-area::-webkit-scrollbar { display: none; }

        .node { 
            border: 1px solid var(--brd); 
            padding: 12px; 
            background: #080808; 
            position: relative; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; 
            align-items: flex-start; 
            gap: 12px; 
            border-radius: 2px;
            cursor: pointer;
        }

        .node:hover { border-color: var(--dim); }
        .node.selected { border-color: var(--fg); background: #111; }
        .node.pending { opacity: 0.5; border-style: dashed; }

        .selector { 
            width: 16px; 
            height: 16px; 
            border: 1px solid var(--dim); 
            margin-top: 2px; 
            border-radius: 1px; 
            flex-shrink: 0;
            transition: 0.2s;
        }
        .node.selected .selector { background: var(--fg); border-color: var(--fg); }

        .txt { 
            font-size: 0.85rem; 
            line-height: 1.5; 
            color: #dddddd; 
            flex: 1; 
            word-break: break-all; 
            letter-spacing: 0.2px;
        }

        .meta { 
            font-size: 0.6rem; 
            color: var(--dim); 
            margin-top: 8px; 
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
        }

        /* --- Control Systems --- */
        .controls { 
            padding: 10px 15px; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid var(--brd);
            background: #050505;
        }

        .btn-sm { 
            flex: 1; 
            padding: 10px; 
            font-size: 9px; 
            font-weight: bold; 
            text-transform: uppercase; 
            border: 1px solid var(--brd); 
            background: transparent; 
            color: var(--fg); 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-sm:hover { background: var(--fg); color: var(--bg); }
        .btn-flash { border-color: var(--dim); color: var(--dim); }
        .btn-flash:hover { border-color: var(--danger); color: var(--danger); background: transparent; }

        /* --- Input System --- */
        .input-zone { 
            padding: 20px; 
            border-top: 1px solid var(--brd); 
            padding-bottom: calc(20px + env(safe-area-inset-bottom)); 
        }

        .bar { 
            display: flex; 
            border: 1px solid var(--brd); 
            background: #000; 
            transition: 0.3s;
        }
        .bar:focus-within { border-color: var(--fg); }

        input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: var(--fg); 
            padding: 14px; 
            font-size: 14px; 
            font-family: inherit; 
        }

        .push-btn { 
            background: var(--fg); 
            color: var(--bg); 
            border: none; 
            padding: 0 25px; 
            cursor: pointer; 
            font-weight: 900; 
            font-size: 11px;
            text-transform: uppercase;
        }

        /* --- Status Indicators --- */
        .status-box { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 4px; height: 4px; background: var(--dim); border-radius: 50%; }
        .status-online { background: #fff; box-shadow: 0 0 8px #fff; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .syncing { animation: pulse 1s infinite; }
    </style>
</head>
<body>

<div class="vault-frame">
    <header>
        <div class="status-box">
            <div id="stat" class="status-dot"></div>
            <span>System Status: <span id="stat-text">Standby</span></span>
        </div>
        <div id="sync-icon"><i data-lucide="activity" size="14"></i></div>
    </header>

    <div id="ch-area"></div>

    <div class="controls">
        <button class="btn-sm" onclick="purgeSelected()">Clear Selected</button>
        <button class="btn-sm btn-flash" onclick="hardFlash()">Hard Flash</button>
    </div>

    <div class="input-zone">
        <div class="bar">
            <input type="text" id="m-in" placeholder="ENTER ENCRYPTED SIGNAL..." autocomplete="off">
            <button class="push-btn" onclick="handlePush()">Transmit</button>
        </div>
    </div>
</div>

<script>
    // --- System Config ---
    const CHANNEL_ID = "v9_mono_" + btoa(window.location.hostname).substring(0,8).toLowerCase();
    const CRYPTO_PASS = "MONO_GHOST_X_00";
    const messageCache = new Set();
    let queue = [];

    // --- Encryption Core (AES-GCM) ---
    async function getCryptoKey() {
        const encoder = new TextEncoder();
        const digest = await crypto.subtle.digest('SHA-256', encoder.encode(CRYPTO_PASS));
        return await crypto.subtle.importKey('raw', digest, 'AES-GCM', false, ['encrypt', 'decrypt']);
    }

    async function processCrypto(data, isEncrypt = true) {
        try {
            const key = await getCryptoKey();
            if (isEncrypt) {
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(data));
                return btoa(JSON.stringify({iv: Array.from(iv), data: Array.from(new Uint8Array(encrypted))}));
            } else {
                const {iv, data: raw} = JSON.parse(atob(data));
                const decrypted = await crypto.subtle.decrypt({name: 'AES-GCM', iv: new Uint8Array(iv)}, key, new Uint8Array(raw));
                return new TextDecoder().decode(decrypted);
            }
        } catch(e) { return null; }
    }

    // --- Networking & Sync ---
    async function syncSystem() {
        const dot = document.getElementById('stat');
        const statText = document.getElementById('stat-text');
        
        try {
            const response = await fetch(`https://ntfy.sh/${CHANNEL_ID}/json?poll=1&since=all`);
            if (response.ok) {
                dot.classList.add('status-online');
                statText.innerText = "Encrypted_Link_Active";
            }

            const rawData = await response.text();
            if (rawData) {
                const lines = rawData.trim().split('\n');
                for (const line of lines) {
                    const packet = JSON.parse(line);
                    if (packet.event === 'message' && !messageCache.has(packet.id)) {
                        const decryptedContent = await processCrypto(packet.message, false);
                        if (decryptedContent) renderMessage(decryptedContent, packet.id);
                        messageCache.add(packet.id);
                    }
                }
            }

            // Flush queue if back online
            if (navigator.onLine && queue.length > 0) {
                const pendingMsg = queue.shift();
                handlePush(pendingMsg);
            }
        } catch (err) {
            dot.classList.remove('status-online');
            statText.innerText = "Network_Stalled";
        }
        setTimeout(syncSystem, 1500);
    }

    function renderMessage(text, id, isPending = false) {
        if (document.getElementById(id)) return;
        const container = document.getElementById('ch-area');
        const node = document.createElement('div');
        
        node.className = `node ${isPending ? 'pending' : ''}`;
        node.id = id;
        node.onclick = () => node.classList.toggle('selected');
        
        node.innerHTML = `
            <div class="selector"></div>
            <div style="flex:1">
                <div class="txt">${text}</div>
                <div class="meta">
                    <span>${new Date().toLocaleTimeString()}</span>
                    <span>${isPending ? 'Queued' : 'Verified'}</span>
                </div>
            </div>
        `;
        
        container.appendChild(node);
        container.scrollTop = container.scrollHeight;
    }

    async function handlePush(manualMsg = null) {
        const input = document.getElementById('m-in');
        const content = manualMsg || input.value;
        if (!content) return;

        const tempId = 'TX-' + Date.now();
        if (!manualMsg) renderMessage(content, tempId, true);
        input.value = "";

        if (!navigator.onLine) {
            queue.push(content);
            return;
        }

        try {
            const encryptedBody = await processCrypto(content, true);
            const res = await fetch(`https://ntfy.sh/${CHANNEL_ID}`, {
                method: 'POST',
                body: encryptedBody,
                headers: { 'X-Priority': 'urgent' }
            });

            if (res.ok) {
                const serverData = await res.json();
                const node = document.getElementById(tempId);
                if (node) {
                    node.id = serverData.id;
                    node.classList.remove('pending');
                    messageCache.add(serverData.id);
                }
            }
        } catch (e) {
            queue.push(content);
        }
    }

    // --- Security Actions ---
    function purgeSelected() {
        const items = document.querySelectorAll('.node.selected');
        items.forEach(item => {
            item.style.opacity = "0";
            item.style.transform = "scale(0.9)";
            setTimeout(() => item.remove(), 300);
        });
    }

    function hardFlash() {
        if (confirm("Execute System Wipe?")) {
            document.getElementById('ch-area').innerHTML = "";
            messageCache.clear();
            queue = [];
            // Visual feedback
            const frame = document.querySelector('.vault-frame');
            frame.style.opacity = "0";
            setTimeout(() => frame.style.opacity = "1", 500);
        }
    }

    // --- Init ---
    document.getElementById('m-in').onkeypress = (e) => e.key === 'Enter' && handlePush();
    window.onload = () => { 
        lucide.createIcons(); 
        syncSystem(); 
        console.log("System Initialized. Monitor active.");
    };
</script>
</body>
</html>
