name: Elite Shop Auto-Update

on:
  schedule:
    - cron: '0 0 * * *' # Every midnight
  workflow_dispatch: # Manual trigger

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Execute Scraper Engine
        run: |
          cd shop
          python engine.py

      - name: Deploy Changes
        run: |
          git config --global user.name "Elite-Bot"
          git config --global user.email "bot@elite.shop"
          git add .
          git commit -m "System Sync: Handpicked deals updated [Automated]"
          git push
