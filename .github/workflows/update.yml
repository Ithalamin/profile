name: Elite Shop Auto-Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write  # গুরুত্বপূর্ণ: এটি ফাইল লেখার অনুমতি দেয়

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node 24 এনাবল করা হলো
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: pip install requests beautifulsoup4 jinja2

      - name: Run Ghost Engine
        run: python generator.py

      - name: Push to Repository
        run: |
          git config --global user.name "Shadow-Bot"
          git config --global user.email "bot@shadow-empire.com"
          git add -A
          git commit -m "Auto-Update: $(date)" || exit 0
          git push origin main
