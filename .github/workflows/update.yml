name: MY SYSTEM

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 jinja2

      - name: Execute System Build
        run: |
          mkdir -p shop
          python generator.py

      - name: Push Updates to Main
        run: |
          git config --global user.name "Shadow-Bot"
          git config --global user.email "bot@shadow-empire.com"
          git add shop/*.html
          git commit -m "Auto-Update: $(date)" || echo "No changes"
          git push origin main
