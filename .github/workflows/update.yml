name: MY SYSTEM

on:
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন রাত ১২টায় অটোমেটিক রান হবে
  workflow_dispatch: # আপনি নিজেও যখন ইচ্ছা রান করতে পারবেন

# গুরুত্বপূর্ণ: এটি গিটহাবকে আপনার রিপোজিটরিতে ফাইল লেখার পারমিশন দেয়
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # পুরো হিস্ট্রি নেবে যাতে পুশ করতে সমস্যা না হয়

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Necessary Libraries
        run: |
          pip install requests beautifulsoup4 jinja2

      - name: Execute Shadow Generator
        run: |
          # shop ফোল্ডার না থাকলে তৈরি করবে
          mkdir -p shop
          python generator.py

      - name: Force Push Changes to GitHub
        run: |
          git config --global user.name "Shadow-Bot"
          git config --global user.email "bot@shadow-empire.com"
          
          # সব নতুন তৈরি হওয়া ফাইল অ্যাড করা
          git add -A
          
          # পরিবর্তন থাকলে কমিট করবে, না থাকলে স্কিপ করবে
          git commit -m "System Sync: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          
          # সরাসরি মেইন ব্রাঞ্চে পুশ
          git push origin main
