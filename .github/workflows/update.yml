name: Elite Shop Auto-Update

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 jinja2

      - name: Execute Generator
        run: |
          # নিশ্চিত করা হচ্ছে shop ফোল্ডারটি আছে
          mkdir -p shop
          python generator.py

      - name: Sync and Push Changes
        run: |
          git config --global user.name "Shop-Bot"
          git config --global user.email "bot@shop.com"
          git add shop/*.html
          # যদি কোনো পরিবর্তন না থাকে তবে এরর দেবে না
          git commit -m "System Refresh: $(date)" || echo "Nothing to update"
          git push origin main
