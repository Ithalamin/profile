<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost-Net V12 | True P2P</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #0d1117; --surface: #161b22; --primary: #238636; --text: #c9d1d9; --border: #30363d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

        header { padding: 15px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #6e7681; }
        .dot.online { background: #238636; box-shadow: 0 0 10px #238636; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; }
        .msg.received { background: var(--surface); align-self: flex-start; border: 1px solid var(--border); }
        .msg.sent { background: var(--primary); color: white; align-self: flex-end; }

        .conn-panel { background: #1c2128; padding: 15px; border-bottom: 1px solid var(--border); }
        input { background: #0d1117; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; outline: none; font-size: 13px; }
        button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 15px; font-weight: 600; transition: 0.2s; }
        .btn-main { background: #21262d; color: #c9d1d9; border: 1px solid var(--border); }
        .btn-main:hover { background: #30363d; }

        footer { padding: 15px; background: var(--surface); display: flex; gap: 10px; }
        .input-area { flex: 1; }
    </style>
</head>
<body>

<header>
    <div class="status">
        <div id="status-dot" class="dot"></div>
        <span id="my-id-display">Generating ID...</span>
    </div>
    <button class="btn-main" onclick="copyID()"><i data-lucide="copy" size="14"></i></button>
</header>

<div class="conn-panel" id="setup-panel">
    <div style="display: flex; gap: 10px;">
        <input type="text" id="peer-id-input" placeholder="Enter Friend's ID" style="flex: 1;">
        <button class="btn-main" style="background: #238636; color: white;" onclick="connectToPeer()">Connect</button>
    </div>
    <p style="font-size: 10px; margin-top: 8px; color: #8b949e;">* দুইজনকেই অনলাইনে থাকতে হবে। আইডি কপি করে বন্ধুকে দিন।</p>
</div>

<main id="chat-box"></main>

<footer>
    <input type="text" id="msg-input" class="input-area" placeholder="Type a message..." disabled>
    <button class="btn-main" id="send-btn" onclick="sendMessage()" disabled><i data-lucide="send" size="18"></i></button>
</footer>

<script>
    let peer = new Peer(); // Create a unique Peer ID
    let conn = null;
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDot = document.getElementById('status-dot');

    // 1. Peer Open: নিজের আইডি পাওয়া
    peer.on('open', (id) => {
        document.getElementById('my-id-display').innerText = "Your ID: " + id;
        statusDot.classList.add('online');
    });

    // 2. Incoming Connection: কেউ যদি আপনাকে কানেক্ট করে
    peer.on('connection', (incomingConn) => {
        conn = incomingConn;
        setupChat();
    });

    // 3. Connect to Peer: আপনি যখন কাউকে কানেক্ট করবেন
    function connectToPeer() {
        const remoteId = document.getElementById('peer-id-input').value;
        if (!remoteId) return alert("Please enter an ID");
        conn = peer.connect(remoteId);
        setupChat();
    }

    function setupChat() {
        conn.on('open', () => {
            document.getElementById('setup-panel').style.display = 'none';
            msgInput.disabled = false;
            sendBtn.disabled = false;
            appendMessage("System", "Direct P2P Connection Established!", "received");
        });

        conn.on('data', (data) => {
            appendMessage("Friend", data, "received");
            showNotification(data);
        });

        conn.on('close', () => {
            alert("Connection Lost");
            location.reload();
        });
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (text && conn && conn.open) {
            conn.send(text);
            appendMessage("You", text, "sent");
            msgInput.value = "";
        }
    }

    function appendMessage(sender, text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function copyID() {
        const idText = document.getElementById('my-id-display').innerText.replace("Your ID: ", "");
        navigator.clipboard.writeText(idText);
        alert("Your ID Copied! Send this to your friend.");
    }

    function showNotification(text) {
        if (Notification.permission === "granted" && document.hidden) {
            new Notification("New Message", { body: text });
        }
    }

    if (Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    window.onkeydown = (e) => { if(e.key === "Enter") sendMessage(); };
    lucide.createIcons();
</script>
</body>
</html>
