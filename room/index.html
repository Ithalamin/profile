<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost-Net | Phantom V20 Stealth</title>
    
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0d0f14; --surface: #161920; --primary: #3b82f6; --text: #f3f4f6;
            --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.08); --me: #2563eb;
            --indicator: #10b981;
        }

        .light {
            --bg: #f8fafc; --surface: #ffffff; --primary: #2563eb; --text: #0f172a;
            --text-dim: #64748b; --border: rgba(0, 0, 0, 0.1); --me: #3b82f6;
            --indicator: #059669;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            height: 100%; width: 100%; background: var(--bg); color: var(--text); 
            display: flex; flex-direction: column; overflow: hidden;
            transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Header UI --- */
        header {
            min-height: 75px; padding: 0 25px; background: var(--surface);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .info-block { display: flex; flex-direction: column; }
        .room-label { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
        .tunnel-status { font-size: 9px; color: var(--text-dim); text-transform: uppercase; margin-top: 3px; font-weight: 600; }

        .nav-tools { display: flex; gap: 12px; }

        .icon-btn {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .icon-btn:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .icon-btn.active { background: var(--primary); color: white; border: none; }

        /* --- Chat Core --- */
        #scroller { 
            flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 18px;
            scroll-behavior: smooth;
        }

        .msg-wrap { display: flex; flex-direction: column; max-width: 80%; animation: entry 0.4s ease forwards; opacity: 0; }
        .msg-wrap.me { align-self: flex-end; }
        
        .bubble { 
            background: var(--surface); padding: 15px 20px; border-radius: 22px;
            font-size: 14.5px; line-height: 1.6; border: 1px solid var(--border); word-break: break-word;
        }
        .me .bubble { background: var(--me); border: none; color: white; border-bottom-right-radius: 5px; }
        .msg-wrap:not(.me) .bubble { border-bottom-left-radius: 5px; }

        .timestamp { font-size: 10px; color: var(--text-dim); margin-top: 7px; padding: 0 12px; font-family: 'JetBrains Mono'; }
        .me .timestamp { text-align: right; }

        /* --- Realtime Feedback --- */
        #typing-status {
            padding: 8px 25px; font-size: 11px; color: var(--indicator);
            font-weight: 600; height: 25px; display: none; opacity: 0.8;
        }

        /* --- Settings Overlay --- */
        #glass-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }

        #settings-pane {
            background: var(--surface); width: 90%; max-width: 420px; padding: 35px;
            border-radius: 32px; border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .setting-row { margin-bottom: 25px; }
        .setting-row label { font-size: 11px; font-weight: 700; color: var(--primary); display: block; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select { 
            width: 100%; background: var(--bg); border: 1px solid var(--border); 
            color: var(--text); padding: 14px 18px; border-radius: 14px; outline: none; transition: 0.3s;
            font-size: 14px;
        }
        input:focus { border-color: var(--primary); }

        /* --- Footer Controller --- */
        footer { 
            padding: 18px 25px; background: var(--surface); border-top: 1px solid var(--border);
            display: flex; gap: 15px; align-items: center;
        }

        .input-group { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 30px; display: flex; align-items: center; padding: 0 20px; transition: 0.3s; }
        .input-group:focus-within { border-color: var(--primary); }
        .input-group input { border: none; background: transparent; padding: 14px 0; width: 100%; font-size: 15px; color: var(--text); outline: none; }
        
        .action-send { background: var(--primary); border: none; width: 48px; height: 48px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .action-send:hover { transform: scale(1.08); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }

        @keyframes entry { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive Breakpoints */
        @media (min-width: 1024px) {
            #scroller { padding: 40px 28%; }
            header, footer, #typing-status { padding-left: 28%; padding-right: 28%; }
        }
    </style>
</head>
<body class="dark" id="phantom-app">

<header>
    <div class="info-block">
        <div class="room-label" id="room-id-display">PHANTOM//INIT</div>
        <div class="tunnel-status">P2P Encryption: AES-256-LZ</div>
    </div>
    <div class="nav-tools">
        <button class="icon-btn" onclick="copyInvite()"><i data-lucide="share" size="18"></i></button>
        <button class="icon-btn" onclick="switchTheme()"><i data-lucide="moon" id="theme-icon" size="18"></i></button>
        <button id="bell-btn" class="icon-btn" onclick="requestNotif()"><i data-lucide="bell" size="18"></i></button>
        <button class="icon-btn" onclick="uiModal(true)"><i data-lucide="settings-2" size="18"></i></button>
    </div>
</header>

<main id="scroller"></main>
<div id="typing-status">...</div>

<div id="glass-overlay" onclick="uiModal(false)">
    <div id="settings-pane" onclick="event.stopPropagation()">
        <h2 style="margin-bottom: 28px; font-size: 22px; font-weight: 600; color: var(--text);">Stealth Configuration</h2>
        
        <div class="setting-row">
            <label>Public Signature (Alias)</label>
            <input type="text" id="alias-input" placeholder="Ghost User" onchange="persistSettings()">
        </div>

        <div class="setting-row">
            <label>Auto-Vanish Frequency</label>
            <select id="vanish-select" onchange="persistSettings()">
                <option value="600000">10 Minutes</option>
                <option value="3600000">1 Hour</option>
                <option value="86400000">24 Hours</option>
                <option value="604800000" selected>7 Days (Standard)</option>
                <option value="0">Eternal (Dev Mode)</option>
            </select>
        </div>

        <div style="background: rgba(59,130,246,0.08); padding: 20px; border-radius: 18px; margin-bottom: 30px; border: 1px solid var(--border);">
            <p style="font-size: 11px; line-height: 1.6; color: var(--text-dim);">
                <span style="color: var(--primary); font-weight: bold;">STUN:</span> active.l.google.com:19302<br>
                <span style="color: var(--primary); font-weight: bold;">MESH:</span> Distributed P2P Graph<br>
                <span style="color: var(--primary); font-weight: bold;">CRYPT:</span> Zero-Knowledge End-to-End
            </p>
        </div>

        <button onclick="nukeCache()" style="width:100%; padding:15px; background:transparent; color:#ef4444; border:1px solid rgba(239,68,68,0.3); border-radius:14px; font-weight:600; cursor:pointer; transition: 0.2s;">Wipe Device Memory</button>
    </div>
</div>

<footer>
    <label class="icon-btn" style="cursor:pointer">
        <i data-lucide="paperclip" size="20"></i>
        <input type="file" id="upload-gate" style="display:none" onchange="handleFile(this)">
    </label>
    <div class="input-group">
        <input type="text" id="main-input" placeholder="Secure transmission..." autocomplete="off">
    </div>
    <button class="action-send" onclick="transmit()">
        <i data-lucide="send" size="20"></i>
    </button>
</footer>

<script>
    // --- 1. Global Setup & ICE Servers ---
    const ROOM_ID = window.location.hash.substring(1) || (window.location.hash = Math.random().toString(36).substring(7));
    document.getElementById('room-id-display').innerText = `ROOM//${ROOM_ID.toUpperCase()}`;

    // STUN Servers Integrated for Firewall Bypass
    const gun = Gun({
        peers: ['https://gun-manhattan.herokuapp.com/gun', 'https://peer.wall.org/gun'],
        rtc: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun.services.mozilla.com' }
            ]
        }
    });

    const mesh = gun.get('phantom_v20_data_' + ROOM_ID);
    const pulse = gun.get('phantom_v20_pulse_' + ROOM_ID);

    // --- 2. Persistent State ---
    let session = JSON.parse(localStorage.getItem('phantom_v20_store')) || {
        alias: "NODE_" + Math.random().toString(36).substring(9).toUpperCase(),
        vanish: 604800000,
        notif: false,
        theme: 'dark'
    };

    // --- 3. Encryption Engine ---
    const Vault = {
        key: () => CryptoJS.SHA256(ROOM_ID + "GHOST_V20_SALT_88").toString(),
        encrypt: (data) => {
            const cipher = CryptoJS.AES.encrypt(JSON.stringify(data), Vault.key()).toString();
            return LZString.compressToUTF16(cipher);
        },
        decrypt: (blob) => {
            try {
                const dec = LZString.decompressFromUTF16(blob);
                const bytes = CryptoJS.AES.decrypt(dec, Vault.key());
                return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
            } catch(e) { return null; }
        }
    };

    // --- 4. Logic & UI Controllers ---
    function uiModal(show) { document.getElementById('glass-overlay').style.display = show ? 'flex' : 'none'; }
    
    function persistSettings() {
        session.alias = document.getElementById('alias-input').value || session.alias;
        session.vanish = document.getElementById('vanish-select').value;
        localStorage.setItem('phantom_v20_store', JSON.stringify(session));
    }

    function switchTheme() {
        session.theme = session.theme === 'dark' ? 'light' : 'dark';
        applyGlobalState();
    }

    function applyGlobalState() {
        document.getElementById('phantom-app').className = session.theme;
        const icon = document.getElementById('theme-icon');
        icon.setAttribute('data-lucide', session.theme === 'dark' ? 'sun' : 'moon');
        lucide.createIcons();
        persistSettings();
    }

    function requestNotif() {
        if (!("Notification" in window)) return;
        Notification.requestPermission().then(permission => {
            if(permission === 'granted') {
                session.notif = !session.notif;
                document.getElementById('bell-btn').classList.toggle('active', session.notif);
                persistSettings();
            }
        });
    }

    // --- 5. Real-time Communication Bridge ---
    const scroller = document.getElementById('scroller');
    const history = new Set();

    // Receiving Data
    mesh.map().once((raw, id) => {
        if(!raw || history.has(id)) return;
        const data = Vault.decrypt(raw.payload);
        if(!data) return;

        // Auto-Delete Logic (Memory Management)
        if (session.vanish != 0 && (Date.now() - data.ts) > parseInt(session.vanish)) {
            mesh.get(id).put(null);
            return;
        }

        history.add(id);
        pushToUI(data);
    });

    function pushToUI(data) {
        const div = document.createElement('div');
        div.className = 'msg-wrap' + (data.uid === session.alias ? ' me' : '');
        
        const time = new Date(data.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const content = data.type === 'file' ? 
            `<a href="${data.blob}" download="${data.name}" style="color:inherit;text-decoration:none"><i data-lucide="download-cloud" size="14" style="vertical-align:middle;margin-right:5px"></i>${data.name}</a>` : 
            data.blob;

        div.innerHTML = `<div class="bubble">${content}</div><div class="timestamp">${data.uid} • ${time}</div>`;
        scroller.appendChild(div);
        scroller.scrollTop = scroller.scrollHeight;
        lucide.createIcons();

        // Notification Engine
        if(session.notif && document.hidden && data.uid !== session.alias) {
            new Notification(data.uid, { body: data.type === 'file' ? "Shared a file" : data.blob });
        }
    }

    // Typing Indicator System
    pulse.map().on((isTyping, user) => {
        if(user === session.alias) return;
        const statusEl = document.getElementById('typing-status');
        statusEl.innerText = `${user} is typing...`;
        statusEl.style.display = isTyping ? 'block' : 'none';
    });

    let typingTimer;
    document.getElementById('main-input').oninput = () => {
        pulse.get(session.alias).put(true);
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => pulse.get(session.alias).put(false), 2000);
    };

    function transmit() {
        const input = document.getElementById('main-input');
        if(!input.value.trim()) return;

        const packet = Vault.encrypt({
            type: 'text',
            blob: input.value,
            uid: session.alias,
            ts: Date.now()
        });

        mesh.set({ payload: packet });
        input.value = '';
        pulse.get(session.alias).put(false);
    }

    function handleFile(el) {
        const file = el.files[0];
        if(!file || file.size > 2 * 1024 * 1024) return alert("System limit: 2MB per file");

        const reader = new FileReader();
        reader.onload = (e) => {
            const packet = Vault.encrypt({
                type: 'file',
                blob: e.target.result,
                name: file.name,
                uid: session.alias,
                ts: Date.now()
            });
            mesh.set({ payload: packet });
        };
        reader.readAsDataURL(file);
    }

    // --- 6. Utilities ---
    function copyInvite() {
        navigator.clipboard.writeText(window.location.href);
        alert("Encrypted Invite Copied!");
    }

    function nukeCache() {
        if(confirm("DANGER: This will permanently erase your local session. Continue?")) {
            localStorage.clear();
            location.reload();
        }
    }

    window.onkeydown = (e) => { if(e.key === "Enter" && document.activeElement.id === 'main-input') transmit(); };

    // Boot App
    document.getElementById('alias-input').value = session.alias;
    document.getElementById('vanish-select').value = session.vanish;
    applyGlobalState();
</script>
</body>
</html>
