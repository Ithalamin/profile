<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost-Net V10 | Real-Time P2P</title>
    
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #0a0c10; --surface: #161b22; --primary: #58a6ff; --text: #c9d1d9;
            --border: #30363d; --me: #1f6feb; --shadow: rgba(0,0,0,0.5);
        }

        .light {
            --bg: #ffffff; --surface: #f6f8fa; --primary: #0969da; --text: #24292f;
            --border: #d0d7de; --me: #0969da; --shadow: rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        
        body, html { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }

        /* HEADER */
        header {
            height: 60px; padding: 0 15px; background: var(--surface);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); z-index: 100; backdrop-filter: blur(10px);
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .id-badge { font-size: 11px; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; opacity: 0.9; }

        /* NAV */
        .nav-btns { display: flex; gap: 10px; }
        .btn { 
            background: transparent; border: 1px solid var(--border); color: var(--text);
            width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn.active { border-color: var(--primary); color: var(--primary); background: rgba(88, 166, 255, 0.1); }

        /* VIEWPORT (CHAT AREA) */
        #viewport { 
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            background: var(--bg); scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        
        /* MESSAGE BUBBLES */
        .msg-container { display: flex; flex-direction: column; max-width: 85%; align-self: flex-start; animation: fadeIn 0.2s ease-out; }
        .msg-container.own { align-self: flex-end; }
        
        .bubble { 
            background: var(--surface); padding: 12px 16px; border-radius: 18px;
            font-size: 14.5px; line-height: 1.5; border: 1px solid var(--border); word-break: break-word;
        }
        .own .bubble { background: var(--me); color: #fff; border: none; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(31, 111, 235, 0.2); }
        .msg-container:not(.own) .bubble { border-bottom-left-radius: 4px; }

        .meta { font-size: 10px; color: #8b949e; margin-top: 5px; display: flex; gap: 8px; font-weight: 500; }
        .own .meta { justify-content: flex-end; }

        /* MODAL */
        #modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: var(--surface); width: 100%; max-width: 380px; padding: 30px;
            border-radius: 20px; border: 1px solid var(--border);
        }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 8px; color: #8b949e; font-weight: 600; }
        input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; outline: none; font-size: 14px; }

        /* FOOTER */
        footer { padding: 15px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
        .input-bar { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 25px; padding: 0 15px; display: flex; align-items: center; }
        footer input { border: none; background: transparent; padding: 12px 0; flex: 1; color: var(--text); outline: none; font-size: 15px; }
        .send-btn { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
        .send-btn:hover { transform: scale(1.05); }

        /* TOAST */
        #toast { position: fixed; top: 75px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; display: none; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* RESPONSIVE */
        @media (min-width: 768px) {
            #viewport { padding: 30px 20%; }
            header { padding: 0 20%; }
            footer { padding: 20px 20%; }
        }
    </style>
</head>
<body class="dark">

<header>
    <div class="logo-area">
        <div class="id-badge" id="room-id">ROOM//CONNECTING...</div>
    </div>
    <div class="nav-btns">
        <button class="btn" onclick="copy()" title="Copy Link"><i data-lucide="link" size="18"></i></button>
        <button class="btn" onclick="toggleTheme()" title="Theme"><i data-lucide="sun" id="theme-ico" size="18"></i></button>
        <button id="notify-btn" class="btn" onclick="requestNotif()" title="Notifications"><i data-lucide="bell" size="18"></i></button>
        <button class="btn" onclick="showModal(true)" title="Settings"><i data-lucide="settings" size="18"></i></button>
    </div>
</header>

<main id="viewport"></main>
<div id="toast">New Update</div>

<div id="modal-overlay" onclick="showModal(false)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="margin-bottom: 25px; font-size: 18px;">Protocol Settings</h3>
        <div class="input-group"><label>Alias (Username)</label><input type="text" id="node-name" onchange="saveSettings()"></div>
        <div class="input-group"><label>Encryption Key</label><input type="password" id="node-key" placeholder="Private key..."></div>
        <div class="input-group"><label>Auto-Destruct</label>
            <select id="node-purge" onchange="saveSettings()">
                <option value="3600000">1 Hour</option>
                <option value="86400000" selected>24 Hours</option>
                <option value="0">Never</option>
            </select>
        </div>
        <button onclick="clearCache()" style="width:100%; padding:14px; background:rgba(218,54,51,0.1); color:#ff7b72; border:1px solid #da3633; border-radius:12px; font-weight:700; cursor:pointer;">Nuke Session</button>
    </div>
</div>

<footer>
    <label style="cursor:pointer" class="btn"><i data-lucide="paperclip" size="20"></i><input type="file" id="file-input" style="display:none" onchange="handleFile(this)"></label>
    <div class="input-bar"><input type="text" id="msg-input" placeholder="Secure message..." autocomplete="off"></div>
    <button class="send-btn" onclick="sendMessage()"><i data-lucide="send" size="20"></i></button>
</footer>

<script>
    const ROOM_HASH = window.location.hash.substring(1) || (window.location.hash = Math.random().toString(36).substring(7));
    document.getElementById('room-id').innerText = `ROOM//${ROOM_HASH.toUpperCase()}`;

    // Reactive P2P Ajax-style Mesh
    const gun = Gun({
        peers: [
            'https://gun-manhattan.herokuapp.com/gun',
            'https://peer.wall.org/gun',
            'https://gundb-relay.herokuapp.com/gun'
        ],
        localStorage: true // local cache for instant loading
    });
    const chatRoom = gun.get('ghost_v10_final_' + ROOM_HASH);

    let state = JSON.parse(localStorage.getItem('ghost_v10_config')) || {
        n: "Ghost_" + Math.random().toString(36).substring(7).toUpperCase(),
        p: 86400000,
        not: false,
        th: 'dark'
    };

    const Cipher = {
        key: () => CryptoJS.SHA256(ROOM_HASH + (document.getElementById('node-key').value || 'GHOST_V10')).toString(),
        seal: (obj) => LZString.compressToUTF16(CryptoJS.AES.encrypt(JSON.stringify(obj), Cipher.key()).toString()),
        open: (blob) => {
            try { return JSON.parse(CryptoJS.AES.decrypt(LZString.decompressFromUTF16(blob), Cipher.key()).toString(CryptoJS.enc.Utf8)); }
            catch(e) { return null; }
        }
    };

    function showModal(s) { document.getElementById('modal-overlay').style.display = s ? 'flex' : 'none'; }
    function saveSettings() {
        state.n = document.getElementById('node-name').value || state.n;
        state.p = document.getElementById('node-purge').value;
        localStorage.setItem('ghost_v10_config', JSON.stringify(state));
    }

    function toggleTheme() { state.th = state.th === 'dark' ? 'light' : 'dark'; applyTheme(); saveSettings(); }
    function applyTheme() {
        document.body.className = state.th;
        const ico = document.getElementById('theme-ico');
        ico.setAttribute('data-lucide', state.th === 'dark' ? 'sun' : 'moon');
        lucide.createIcons();
    }

    function requestNotif() {
        if (!("Notification" in window)) return notifyToast("Browser not supported");
        Notification.requestPermission().then(p => {
            if(p === 'granted') {
                state.not = !state.not;
                document.getElementById('notify-btn').classList.toggle('active', state.not);
                saveSettings();
                notifyToast(state.not ? "Notifications Enabled" : "Notifications Disabled");
            }
        });
    }

    function notifyToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // REAL-TIME AJAX SYSTEM (Reactive Listeners)
    const view = document.getElementById('viewport');
    const processedMessages = new Set();

    chatRoom.map().on((data, id) => {
        if(!data || !data.payload || processedMessages.has(id)) return;
        const msg = Cipher.open(data.payload);
        if(!msg) return;

        // Auto-Purge Logic
        if (state.p != 0 && (Date.now() - msg.ts) > parseInt(state.p)) { chatRoom.get(id).put(null); return; }

        processedMessages.add(id);
        const row = document.createElement('div');
        row.className = 'msg-container' + (msg.s === state.n ? ' own' : '');
        const content = msg.t === 'txt' ? msg.c : `<a href="${msg.c}" download="${msg.f}" style="color:inherit; font-weight:bold;">📎 ${msg.f}</a>`;
        
        row.innerHTML = `<div class="bubble">${content}</div><div class="meta"><span>${msg.s}</span><span>${new Date(msg.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`;
        view.appendChild(row);
        view.scrollTop = view.scrollHeight;

        if(msg.s !== state.n) {
            if(state.not && !document.hidden) notifyToast(`New message from ${msg.s}`);
            if(state.not && document.hidden) new Notification(`Ghost-Net`, { body: `${msg.s}: ${msg.t === 'txt' ? msg.content : 'sent a file'}` });
        }
    });

    function sendMessage() {
        const input = document.getElementById('msg-input');
        if(!input.value.trim()) return;
        chatRoom.set({ payload: Cipher.seal({ t: 'txt', c: input.value, s: state.n, ts: Date.now() }) });
        input.value = '';
    }

    function handleFile(el) {
        const file = el.files[0];
        if (file.size > 1048576) return alert("Max size 1MB");
        const reader = new FileReader();
        reader.onload = (e) => chatRoom.set({ payload: Cipher.seal({ t: 'file', c: e.target.result, f: file.name, s: state.n, ts: Date.now() }) });
        reader.readAsDataURL(file);
    }

    function copy() { navigator.clipboard.writeText(window.location.href); notifyToast("Room link copied!"); }
    function clearCache() { if(confirm("Wipe all data?")) { localStorage.clear(); location.reload(); } }
    
    window.onkeydown = (e) => { if(e.key === "Enter" && document.activeElement.id === 'msg-input') sendMessage(); };

    // Heartbeat to keep P2P connection alive (The AJAX replacement)
    setInterval(() => { gun.get('heartbeat').put({time: Date.now()}); }, 20000);

    // Initialization
    document.getElementById('node-name').value = state.n;
    document.getElementById('node-purge').value = state.p;
    if(state.not) document.getElementById('notify-btn').classList.add('active');
    applyTheme();
    lucide.createIcons();
</script>
</body>
</html>
