<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat_room | Secure P2P</title>
    
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #0a0c10; --surface: #161b22; --primary: #58a6ff; --text: #c9d1d9;
            --border: #30363d; --me: #1f6feb; --shadow: rgba(0,0,0,0.5);
        }

        .light {
            --bg: #ffffff; --surface: #f6f8fa; --primary: #0969da; --text: #24292f;
            --border: #d0d7de; --me: #0969da; --shadow: rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        
        body, html { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER */
        header {
            height: 60px; padding: 0 15px; background: var(--surface);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); box-shadow: 0 2px 10px var(--shadow); z-index: 50;
        }
        .id-badge { font-size: 12px; font-weight: 600; color: var(--primary); background: rgba(88, 166, 255, 0.1); padding: 5px 10px; border-radius: 6px; }

        /* ACTIONS */
        .nav-btns { display: flex; gap: 8px; }
        .icon-btn { 
            background: transparent; border: 1px solid var(--border); color: var(--text);
            width: 35px; height: 35px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .icon-btn:hover { background: var(--border); }
        .icon-btn.active { border-color: var(--primary); color: var(--primary); }

        /* CHAT BOX */
        #viewport { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px;
            background: var(--bg); scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        .msg-row { display: flex; flex-direction: column; max-width: 85%; align-self: flex-start; }
        .msg-row.own { align-self: flex-end; }
        
        .bubble { 
            background: var(--surface); padding: 12px 16px; border-radius: 18px;
            font-size: 15px; line-height: 1.4; border: 1px solid var(--border); word-wrap: break-word;
        }
        .own .bubble { background: var(--me); color: #fff; border: none; border-bottom-right-radius: 4px; }
        .msg-row:not(.own) .bubble { border-bottom-left-radius: 4px; }

        .ts { font-size: 10px; color: #8b949e; margin-top: 4px; display: flex; gap: 5px; }
        .own .ts { justify-content: flex-end; }

        /* SETTINGS MODAL */
        #modal-box {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal {
            background: var(--surface); width: 100%; max-width: 380px; padding: 25px;
            border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 50px #000;
        }
        .field { margin-bottom: 15px; }
        .field label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px; color: #8b949e; }
        input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; outline: none; }

        /* FOOTER */
        footer { padding: 10px 15px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
        .input-wrap { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 0 15px; display: flex; align-items: center; }
        footer input { border: none; background: transparent; padding: 10px 0; flex: 1; color: var(--text); outline: none; }
        .send-btn { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* TOAST */
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 12px; display: none; z-index: 2000; }

        /* RESPONSIVE DESKTOP */
        @media (min-width: 768px) {
            #viewport { padding: 30px 25%; }
            header { padding: 0 25%; }
            footer { padding: 15px 25%; }
            .msg-row { max-width: 70%; }
        }
    </style>
</head>
<body class="dark">

<header>
    <div class="id-badge" id="room-label">GHOST//SYNCING</div>
    <div class="nav-btns">
        <button class="icon-btn" onclick="copy()"><i data-lucide="link" size="18"></i></button>
        <button class="icon-btn" onclick="toggleT()"><i data-lucide="sun" id="t-icon" size="18"></i></button>
        <button id="n-btn" class="icon-btn" onclick="askNotif()"><i data-lucide="bell" size="18"></i></button>
        <button class="icon-btn" onclick="openM(true)"><i data-lucide="settings" size="18"></i></button>
    </div>
</header>

<main id="viewport"></main>
<div id="toast">New Message Received</div>

<div id="modal-box" onclick="openM(false)">
    <div class="modal" onclick="event.stopPropagation()">
        <h3 style="margin-bottom: 20px;">Node Settings</h3>
        <div class="field"><label>Display Alias</label><input type="text" id="set-n" onchange="upd()"></div>
        <div class="field"><label>Room Password (Key)</label><input type="password" id="set-k" placeholder="Secret Key"></div>
        <div class="field"><label>Auto-Destruct</label>
            <select id="set-p" onchange="upd()">
                <option value="3600000">1 Hour</option>
                <option value="86400000" selected>24 Hours</option>
                <option value="0">Never</option>
            </select>
        </div>
        <button onclick="nuke()" style="width:100%; padding:12px; background:#da3633; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Destroy Cache</button>
    </div>
</div>

<footer>
    <label style="cursor:pointer" class="icon-btn"><i data-lucide="plus" size="20"></i><input type="file" id="f-in" style="display:none" onchange="upFile(this)"></label>
    <div class="input-wrap"><input type="text" id="m-in" placeholder="Message..." autocomplete="off"></div>
    <button class="send-btn" onclick="send()"><i data-lucide="send" size="18"></i></button>
</footer>

<script>
    // ROOM SETUP & RELAYS
    const HASH = window.location.hash.substring(1) || (window.location.hash = Math.random().toString(36).substring(7));
    document.getElementById('room-label').innerText = `ROOM//${HASH.toUpperCase()}`;

    // Multiple relays for 100% uptime
    const gun = Gun({
        peers: [
            'https://gun-manhattan.herokuapp.com/gun',
            'https://peer.wall.org/gun',
            'https://gundb-relay.herokuapp.com/gun',
            'https://gun-us.herokuapp.com/gun'
        ]
    });
    const db = gun.get('ghost_v9_core_' + HASH);

    let state = JSON.parse(localStorage.getItem('ghost_v9_st')) || {
        n: "Ghost_" + Math.random().toString(36).substring(7).toUpperCase(),
        p: 86400000,
        not: false,
        th: 'dark'
    };

    const Cryp = {
        k: () => CryptoJS.SHA256(HASH + (document.getElementById('set-k').value || 'GHOST_SECURE')).toString(),
        pack: (o) => LZString.compressToUTF16(CryptoJS.AES.encrypt(JSON.stringify(o), Cryp.k()).toString()),
        unpack: (b) => {
            try { return JSON.parse(CryptoJS.AES.decrypt(LZString.decompressFromUTF16(b), Cryp.k()).toString(CryptoJS.enc.Utf8)); }
            catch(e) { return null; }
        }
    };

    function openM(s) { document.getElementById('modal-box').style.display = s ? 'flex' : 'none'; }
    function upd() {
        state.n = document.getElementById('set-n').value || state.n;
        state.p = document.getElementById('set-p').value;
        localStorage.setItem('ghost_v9_st', JSON.stringify(state));
    }

    function toggleT() { state.th = state.th === 'dark' ? 'light' : 'dark'; applyT(); upd(); }
    function applyT() {
        document.body.className = state.th;
        const ico = document.getElementById('t-icon');
        ico.setAttribute('data-lucide', state.th === 'dark' ? 'sun' : 'moon');
        lucide.createIcons();
    }

    function askNotif() {
        if (!("Notification" in window)) return showToast("Not supported in this browser");
        Notification.requestPermission().then(p => {
            if(p === 'granted') {
                state.not = !state.not;
                document.getElementById('n-btn').classList.toggle('active', state.not);
                upd();
                showToast(state.not ? "Notifications On" : "Notifications Off");
            }
        });
    }

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    const view = document.getElementById('viewport');
    db.map().once((data, id) => {
        if(!data || !data.payload) return;
        const msg = Cryp.unpack(data.payload);
        if(!msg) return;

        // Purge check
        if (state.p != 0 && (Date.now() - msg.ts) > parseInt(state.p)) { db.get(id).put(null); return; }

        const row = document.createElement('div');
        row.className = 'msg-row' + (msg.s === state.n ? ' own' : '');
        const content = msg.t === 'txt' ? msg.c : `<a href="${msg.c}" download="${msg.f}" style="color:inherit; font-weight:bold;">📎 ${msg.f}</a>`;
        
        row.innerHTML = `<div class="bubble">${content}</div><div class="ts"><span>${msg.s}</span><span>${new Date(msg.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`;
        view.appendChild(row);
        view.scrollTop = view.scrollHeight;

        if(msg.s !== state.n) {
            if(state.not && !document.hidden) showToast(`Message from ${msg.s}`);
            if(state.not && document.hidden) new Notification(`Ghost-Net: ${msg.s}`, { body: msg.t === 'txt' ? msg.c : "Shared a file" });
        }
    });

    function send() {
        const i = document.getElementById('m-in');
        if(!i.value.trim()) return;
        db.set({ payload: Cryp.pack({ t: 'txt', c: i.value, s: state.n, ts: Date.now() }) });
        i.value = '';
    }

    function upFile(el) {
        const file = el.files[0];
        if (file.size > 1000000) return alert("File too big (Max 1MB)");
        const reader = new FileReader();
        reader.onload = (e) => db.set({ payload: Cryp.pack({ t: 'file', c: e.target.result, f: file.name, s: state.n, ts: Date.now() }) });
        reader.readAsDataURL(file);
    }

    function copy() { navigator.clipboard.writeText(window.location.href); showToast("Link Copied!"); }
    function nuke() { if(confirm("Clear everything?")) { localStorage.clear(); location.reload(); } }
    
    window.onkeydown = (e) => { if(e.key === "Enter" && document.activeElement.id === 'm-in') send(); };

    // Init
    document.getElementById('set-n').value = state.n;
    document.getElementById('set-p').value = state.p;
    if(state.not) document.getElementById('n-btn').classList.add('active');
    applyT();
    lucide.createIcons();
</script>
</body>
</html>
