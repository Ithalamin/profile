<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHAT_ROOM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0b0e11; --surface: #1a1f24; --primary: #3b82f6; --text: #f3f4f6;
            --text-dim: #9ca3af; --border: rgba(255,255,255,0.06); --me-bubble: #2563eb;
        }

        .light-mode {
            --bg: #f9fafb; --surface: #ffffff; --primary: #2563eb; --text: #111827;
            --text-dim: #6b7280; --border: rgba(0,0,0,0.08); --me-bubble: #3b82f6;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        
        body { 
            background: var(--bg); color: var(--text); height: 100vh; 
            display: flex; flex-direction: column; overflow: hidden;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* HEADER */
        header {
            height: 65px; padding: 0 20px; background: rgba(var(--bg), 0.8);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); z-index: 100;
        }
        .room-id { font-weight: 600; font-size: 13px; letter-spacing: 1px; color: var(--primary); opacity: 0.9; }
        .nav-actions { display: flex; gap: 12px; }
        
        .btn-icon { 
            background: var(--surface); border: 1px solid var(--border); color: var(--text); 
            width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-icon:hover { border-color: var(--primary); transform: translateY(-1px); }
        .btn-icon.active { color: var(--primary); background: rgba(59, 130, 246, 0.1); }

        /* CHAT */
        #chat-scroller { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 80%; animation: slideIn 0.2s ease-out; }
        .msg-wrap.me { align-self: flex-end; }
        
        .bubble { 
            background: var(--surface); padding: 11px 15px; border-radius: 18px;
            font-size: 14.5px; line-height: 1.5; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .me .bubble { background: var(--me-bubble); border: none; color: #fff; border-bottom-right-radius: 4px; }
        .msg-wrap:not(.me) .bubble { border-bottom-left-radius: 4px; }

        .meta { font-size: 10px; color: var(--text-dim); margin-top: 5px; padding: 0 6px; font-weight: 500; }
        .me .meta { text-align: right; }

        /* MODAL (Pop-up) */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        #settings-modal {
            background: var(--surface); width: 90%; max-width: 400px; padding: 25px;
            border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: scale(0.9); transition: 0.3s;
        }
        #modal-overlay.open { display: flex; }
        #modal-overlay.open #settings-modal { transform: scale(1); }

        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 600; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
        .m-input { 
            width: 100%; background: var(--bg); border: 1px solid var(--border); 
            color: var(--text); padding: 12px; border-radius: 12px; outline: none; font-size: 14px;
        }

        /* INPUT FOOTER */
        footer { padding: 15px 20px; background: transparent; display: flex; gap: 10px; align-items: center; }
        .input-pill { 
            flex: 1; background: var(--surface); border: 1px solid var(--border); 
            color: var(--text); padding: 12px 18px; border-radius: 15px; outline: none; font-size: 15px;
        }
        .btn-send { 
            background: var(--primary); color: #fff; border: none; width: 45px; height: 45px;
            border-radius: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <div class="room-id" id="display-room">ROOM//LOADING</div>
    <div class="nav-actions">
        <button class="btn-icon" onclick="copyLink()"><i data-lucide="share-2" size="18"></i></button>
        <button class="btn-icon" onclick="toggleTheme()"><i data-lucide="sun" id="theme-icon" size="18"></i></button>
        <button id="notify-btn" class="btn-icon" onclick="toggleNotify()"><i data-lucide="bell" size="18"></i></button>
        <button class="btn-icon" onclick="toggleModal(true)"><i data-lucide="settings" size="18"></i></button>
    </div>
</header>

<main id="chat-scroller"></main>

<div id="modal-overlay" onclick="toggleModal(false)">
    <div id="settings-modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span>Room Configuration</span>
            <div style="cursor:pointer" onclick="toggleModal(false)"><i data-lucide="x" size="20"></i></div>
        </div>
        <div class="input-group">
            <label>Ghost Alias</label>
            <input type="text" id="cfg-name" class="m-input" onchange="save()">
        </div>
        <div class="input-group">
            <label>Encryption Passphrase</label>
            <input type="password" id="cfg-key" class="m-input" placeholder="Room secret key...">
        </div>
        <div class="input-group">
            <label>Automatic Purge</label>
            <select id="cfg-purge" class="m-input" onchange="save()">
                <option value="3600000">After 1 Hour</option>
                <option value="86400000" selected>After 24 Hours</option>
                <option value="0">Never (Persistent)</option>
            </select>
        </div>
        <button class="m-input" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; margin-top: 10px; cursor: pointer;" onclick="nuke()">Destroy Session</button>
    </div>
</div>

<footer>
    <label style="cursor:pointer" class="btn-icon">
        <i data-lucide="paperclip" size="18"></i>
        <input type="file" id="file-in" style="display:none" onchange="handleFile(this)">
    </label>
    <input type="text" id="msg-in" class="input-pill" placeholder="Type a message..." autocomplete="off">
    <button class="btn-send" onclick="send()"><i data-lucide="send" size="20" color="#fff"></i></button>
</footer>

<script>
    const ROOM = window.location.hash.substring(1) || (window.location.hash = Math.random().toString(36).substring(7));
    document.getElementById('display-room').innerText = `ROOM//${ROOM.toUpperCase()}`;

    const gun = Gun(['https://gun-manhattan.herokuapp.com/gun', 'https://peer.wall.org/gun']);
    const db = gun.get('ghost_v7_final_' + ROOM);

    let state = JSON.parse(localStorage.getItem('ghost_v7_state')) || {
        name: "Ghost_" + Math.random().toString(36).substring(7).toUpperCase(),
        purge: 86400000,
        notify: false,
        theme: 'dark'
    };

    const Crypt = {
        key: () => CryptoJS.SHA256(ROOM + (document.getElementById('cfg-key').value || 'GHOST')).toString(),
        pack: (obj) => LZString.compressToUTF16(CryptoJS.AES.encrypt(JSON.stringify(obj), Crypt.key()).toString()),
        unpack: (blob) => {
            try { return JSON.parse(CryptoJS.AES.decrypt(LZString.decompressFromUTF16(blob), Crypt.key()).toString(CryptoJS.enc.Utf8)); }
            catch(e) { return null; }
        }
    };

    function toggleModal(show) { document.getElementById('modal-overlay').classList.toggle('open', show); }
    function save() {
        state.name = document.getElementById('cfg-name').value || state.name;
        state.purge = document.getElementById('cfg-purge').value;
        localStorage.setItem('ghost_v7_state', JSON.stringify(state));
    }

    function toggleTheme() {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        save();
    }

    function applyTheme() {
        document.body.classList.toggle('light-mode', state.theme === 'light');
        const icon = document.getElementById('theme-icon');
        icon.setAttribute('data-lucide', state.theme === 'light' ? 'moon' : 'sun');
        lucide.createIcons();
    }

    const scroller = document.getElementById('chat-scroller');
    db.map().once((data, id) => {
        if(!data) return;
        const msg = Crypt.unpack(data.payload);
        if(!msg) return;

        if (state.purge != 0 && (Date.now() - msg.ts) > parseInt(state.purge)) {
            db.get(id).put(null); return;
        }

        const div = document.createElement('div');
        div.className = 'msg-wrap' + (msg.s === state.name ? ' me' : '');
        const body = msg.type === 'text' ? msg.content : `<a href="${msg.content}" download="${msg.name}" style="color:inherit;text-decoration:underline">📎 ${msg.name}</a>`;
        div.innerHTML = `<div class="bubble">${body}</div><div class="meta">${msg.s} • ${new Date(msg.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;
        scroller.appendChild(div);
        scroller.scrollTop = scroller.scrollHeight;
        if(state.notify && document.hidden) new Notification("New Ghost Msg", { body: `${msg.s}: ${msg.type==='text'?msg.content:'File'}` });
    });

    function send() {
        const input = document.getElementById('msg-in');
        if(!input.value.trim()) return;
        db.set({ payload: Crypt.pack({ type: 'text', content: input.value, s: state.name, ts: Date.now() }) });
        input.value = '';
    }

    function handleFile(el) {
        const file = el.files[0];
        if (file.size > 1048576) return alert("Limit: 1MB");
        const r = new FileReader();
        r.onload = (e) => db.set({ payload: Crypt.pack({ type: 'file', content: e.target.result, name: file.name, s: state.name, ts: Date.now() }) });
        r.readAsDataURL(file);
    }

    function toggleNotify() {
        Notification.requestPermission().then(p => {
            if(p==='granted') { state.notify = !state.notify; document.getElementById('notify-btn').classList.toggle('active', state.notify); save(); }
        });
    }

    function copyLink() { navigator.clipboard.writeText(window.location.href); alert("Room ID linked."); }
    function nuke() { if(confirm("Wipe everything?")) { localStorage.clear(); location.reload(); } }
    window.onkeydown = (e) => { if(e.key === "Enter" && document.activeElement.id === 'msg-in') send(); };

    // Initial load
    document.getElementById('cfg-name').value = state.name;
    document.getElementById('cfg-purge').value = state.purge;
    applyTheme();
    lucide.createIcons();
</script>
</body>
</html>
