<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost-Net V11 | Ultra Stability</title>
    
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --bg: #0d1117; --surface: #161b22; --primary: #2f81f7; --text: #c9d1d9; --border: #30363d; --me: #238636; }
        .light { --bg: #ffffff; --surface: #f6f8fa; --primary: #0969da; --text: #24292f; --border: #d0d7de; --me: #2da44e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        body, html { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; }
        header { height: 60px; padding: 0 15px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 100; }
        .btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #viewport { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; flex-direction: column; max-width: 80%; align-self: flex-start; }
        .msg.own { align-self: flex-end; }
        .bubble { background: var(--surface); padding: 12px; border-radius: 15px; border: 1px solid var(--border); font-size: 14px; word-break: break-all; }
        .own .bubble { background: var(--me); color: #fff; border: none; }
        footer { padding: 15px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-bar { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 0 15px; display: flex; }
        input { border: none; background: transparent; padding: 12px 0; flex: 1; color: var(--text); outline: none; }
        .send { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 8px 15px; border-radius: 20px; font-size: 12px; display: none; }
        @media (min-width: 768px) { #viewport, header, footer { padding-left: 25%; padding-right: 25%; } }
    </style>
</head>
<body>

<header>
    <div style="font-size: 12px; font-weight: bold; color: var(--primary);" id="room-tag">SYNCING...</div>
    <div style="display: flex; gap: 8px;">
        <button class="btn" onclick="copy()"><i data-lucide="link" size="18"></i></button>
        <button class="btn" id="n-btn" onclick="askNotif()"><i data-lucide="bell" size="18"></i></button>
        <button class="btn" onclick="toggleM(true)"><i data-lucide="settings" size="18"></i></button>
    </div>
</header>

<main id="viewport"></main>
<div id="toast"></div>

<div id="modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:1000;" onclick="toggleM(false)">
    <div style="background:var(--surface); width:90%; max-width:350px; padding:25px; border-radius:15px;" onclick="event.stopPropagation()">
        <h4 style="margin-bottom:15px">Settings</h4>
        <label style="font-size:11px">Name</label><input type="text" id="nn" style="width:100%; margin-bottom:10px" onchange="upd()">
        <label style="font-size:11px">Room Key (Must match other users)</label><input type="password" id="nk" style="width:100%; margin-bottom:15px" placeholder="Secret Key">
        <button onclick="nuke()" style="width:100%; padding:10px; background:#da3633; color:#fff; border:none; border-radius:8px; cursor:pointer">Clear All</button>
    </div>
</div>

<footer>
    <input type="text" id="mi" style="background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:10px 15px; flex:1; color:var(--text)" placeholder="Message..." autocomplete="off">
    <button class="send" onclick="send()"><i data-lucide="send" size="20"></i></button>
</footer>

<script>
    const RH = window.location.hash.substring(1) || (window.location.hash = Math.random().toString(36).substring(7));
    document.getElementById('room-tag').innerText = `ROOM//${RH.toUpperCase()}`;

    // Improved Multi-Relay Grid
    const gun = Gun({
        peers: [
            'https://gun-manhattan.herokuapp.com/gun',
            'https://peer.wall.org/gun',
            'https://gundb-relay.herokuapp.com/gun'
        ]
    });
    const db = gun.get('ghost_v11_stable_' + RH);

    let st = JSON.parse(localStorage.getItem('ghost_v11_st')) || {
        n: "Ghost_" + Math.random().toString(36).substring(7).toUpperCase(),
        not: false
    };

    const Cry = {
        k: () => CryptoJS.SHA256(RH + (document.getElementById('nk').value || 'STABLE')).toString(),
        e: (o) => LZString.compressToUTF16(CryptoJS.AES.encrypt(JSON.stringify(o), Cry.k()).toString()),
        d: (b) => {
            try { return JSON.parse(CryptoJS.AES.decrypt(LZString.decompressFromUTF16(b), Cry.k()).toString(CryptoJS.enc.Utf8)); }
            catch(e) { return null; }
        }
    };

    function toggleM(s) { document.getElementById('modal').style.display = s ? 'flex' : 'none'; }
    function upd() { st.n = document.getElementById('nn').value || st.n; localStorage.setItem('ghost_v11_st', JSON.stringify(st)); }

    function askNotif() {
        Notification.requestPermission().then(p => {
            if(p === 'granted') { st.not = !st.not; document.getElementById('n-btn').style.color = st.not ? '#2f81f7' : ''; upd(); }
        });
    }

    const vp = document.getElementById('viewport');
    const seen = new Set();

    // The AJAX-Like Listener
    db.map().on((data, id) => {
        if(!data || seen.has(id)) return;
        const m = Cry.d(data.payload);
        if(!m) return;

        seen.add(id);
        const r = document.createElement('div');
        r.className = 'msg' + (m.s === st.n ? ' own' : '');
        r.innerHTML = `<div class="bubble">${m.c}</div><div style="font-size:9px; margin-top:4px; opacity:0.6">${m.s}</div>`;
        vp.appendChild(r);
        vp.scrollTop = vp.scrollHeight;

        if(m.s !== st.n && st.not && document.hidden) new Notification(`Ghost: ${m.s}`, { body: m.c });
    });

    function send() {
        const i = document.getElementById('mi');
        if(!i.value.trim()) return;
        db.set({ payload: Cry.e({ c: i.value, s: st.n, ts: Date.now() }) });
        i.value = '';
    }

    function copy() { navigator.clipboard.writeText(window.location.href); alert("Link Copied!"); }
    function nuke() { localStorage.clear(); location.reload(); }
    window.onkeydown = (e) => { if(e.key === "Enter") send(); };
    lucide.createIcons();
    document.getElementById('nn').value = st.n;
</script>
</body>
</html>
