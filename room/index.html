<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Room</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #05070a; --surface: #0f1218; --primary: #00ff41; --text: #e0e0e0;
            --border: #1a1f26; --me: #003b00;
        }
        .light-mode {
            --bg: #ffffff; --surface: #f0f2f5; --primary: #007bff; --text: #1c1e21;
            --border: #ddd; --me: #007bff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            height: 60px; padding: 0 15px; background: var(--surface);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); border-top: 2px solid var(--primary);
        }
        .id-label { font-size: 10px; color: var(--primary); text-shadow: 0 0 5px var(--primary); font-weight: bold; }
        .nav { display: flex; gap: 10px; }
        .btn-icon { 
            background: transparent; border: 1px solid var(--border); color: var(--text); 
            width: 35px; height: 35px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { border-color: var(--primary); box-shadow: 0 0 8px var(--primary); }

        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,255,65,0.02) 1px, rgba(0,255,65,0.02) 2px); }
        .msg { max-width: 85%; padding: 10px; border-radius: 4px; font-size: 13px; border: 1px solid var(--border); position: relative; }
        .msg.me { align-self: flex-end; background: var(--me); border-color: var(--primary); color: #00ff41; }
        .msg.received { align-self: flex-start; background: var(--surface); }

        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-box { background: var(--surface); width: 90%; max-width: 400px; padding: 25px; border: 1px solid var(--primary); border-radius: 5px; }
        input { width: 100%; background: #000; border: 1px solid var(--border); color: var(--primary); padding: 12px; margin-top: 10px; outline: none; }

        footer { padding: 10px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
        .input-box { flex: 1; background: #000; border: 1px solid var(--border); padding: 10px; color: var(--primary); outline: none; border-radius: 4px; }
        .send-btn { background: var(--primary); color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }

        @media (min-width: 768px) { #chat, footer, header { padding-left: 25%; padding-right: 25%; } }
    </style>
</head>
<body>

<header>
    <div class="id-label" id="my-id" onclick="copyID()">[ INITIALIZING SECURE NODE... ]</div>
    <div class="nav">
        <button class="btn-icon" onclick="copyID()"><i data-lucide="share-2" size="16"></i></button>
        <button class="btn-icon" onclick="toggleTheme()"><i data-lucide="zap" size="16"></i></button>
        <button class="btn-icon" onclick="toggleModal(true)"><i data-lucide="terminal" size="16"></i></button>
    </div>
</header>

<main id="chat"></main>

<div id="modal" onclick="toggleModal(false)">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3 style="color:var(--primary)">SECURE HANDSHAKE</h3>
        <input type="text" id="target-id" placeholder="PARTNER PEER ID">
        <input type="password" id="secret-key" placeholder="QUANTUM PASS-KEY (MUST MATCH)">
        <button onclick="connect()" style="width:100%; margin-top:15px; background:var(--primary); padding:10px; border:none; cursor:pointer; font-weight:bold;">ESTABLISH TUNNEL</button>
    </div>
</div>

<footer>
    <label class="btn-icon" style="cursor:pointer">
        <i data-lucide="plus" size="20"></i>
        <input type="file" id="file-in" style="display:none" onchange="sendFile(this)">
    </label>
    <input type="text" id="msg-in" class="input-box" placeholder="ENCRYPTED TRAFFIC..." disabled>
    <button class="send-btn" id="send-btn" onclick="send()" disabled>SEND</button>
</footer>

<script>
    let peer = new Peer();
    let conn = null;
    let theme = 'dark';

    peer.on('open', id => document.getElementById('my-id').innerText = `NODE//${id.toUpperCase()}`);
    peer.on('connection', c => { conn = c; setup(); });

    const CryptoProtocol = {
        getKey: () => CryptoJS.SHA512(document.getElementById('secret-key').value || 'GHOST_NULL').toString(),
        encrypt: (data) => CryptoJS.AES.encrypt(data, CryptoProtocol.getKey()).toString(),
        decrypt: (data) => {
            try { return CryptoJS.AES.decrypt(data, CryptoProtocol.getKey()).toString(CryptoJS.enc.Utf8); }
            catch(e) { return "[ DECRYPTION FAILED: KEY MISMATCH ]"; }
        }
    };

    function connect() {
        const id = document.getElementById('target-id').value;
        conn = peer.connect(id);
        setup();
        toggleModal(false);
    }

    function setup() {
        conn.on('open', () => {
            document.getElementById('msg-in').disabled = false;
            document.getElementById('send-btn').disabled = false;
            log("TUNNEL ESTABLISHED: E2EE ACTIVE", "me");
        });
        conn.on('data', data => {
            const dec = CryptoProtocol.decrypt(data.payload);
            if(data.type === 'file') {
                log(`FILE RECEIVED: <a href="${dec}" download="${data.name}" style="color:var(--primary)">${data.name}</a>`, "received");
            } else {
                log(dec, "received");
            }
        });
    }

    function send() {
        const val = document.getElementById('msg-in').value;
        if(!val || !conn) return;
        conn.send({ type: 'text', payload: CryptoProtocol.encrypt(val) });
        log(val, "me");
        document.getElementById('msg-in').value = "";
    }

    function sendFile(el) {
        const file = el.files[0];
        if(file.size > 2000000) return alert("MAX 2MB");
        const reader = new FileReader();
        reader.onload = e => {
            conn.send({ type: 'file', payload: CryptoProtocol.encrypt(e.target.result), name: file.name });
            log(`FILE SENT: ${file.name}`, "me");
        };
        reader.readAsDataURL(file);
    }

    function log(m, type) {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerHTML = `<div>${m}</div><div style="font-size:8px; opacity:0.5; margin-top:5px;">${new Date().toLocaleTimeString()}</div>`;
        document.getElementById('chat').appendChild(d);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    function toggleModal(s) { document.getElementById('modal').style.display = s ? 'flex' : 'none'; }
    function copyID() {
        const id = document.getElementById('my-id').innerText.replace("NODE//", "");
        navigator.clipboard.writeText(id);
        alert("NODE ID COPIED. SHARE SECURELY.");
    }
    function toggleTheme() {
        theme = theme === 'dark' ? 'light' : 'dark';
        document.body.className = theme === 'light' ? 'light-mode' : '';
    }
    window.onkeydown = e => { if(e.key === "Enter") send(); };
    lucide.createIcons();
</script>
</body>
</html>
