<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0x | 404 - Path Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&display=swap');
        
        body {
            background-color: #ffffff;
            color: #1a1a1a;
            font-family: 'Fira Code', monospace;
            overflow: hidden;
        }

        .terminal-window {
            border: 1px solid #e5e7eb;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background: #00ff41;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .glitch-text {
            font-weight: 800;
            font-size: 8rem;
            letter-spacing: -5px;
            color: #f3f4f6;
            position: absolute;
            z-index: -1;
            user-select: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glitch-text uppercase">Error 404</div>

    <main class="w-full max-w-2xl">
        <div class="terminal-window rounded-2xl overflow-hidden">
            <div class="bg-[#f9fafb] px-4 py-3 border-b border-gray-100 flex items-center justify-between">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
                </div>
                <span class="text-[10px] text-gray-400 font-mono tracking-widest uppercase">System_Failure_Detected</span>
            </div>

            <div class="p-10 space-y-8">
                <div>
                    <div class="flex items-center space-x-2 text-sm mb-4">
                        <span class="text-green-600 font-bold">guest@0x:~$</span>
                        <span class="text-gray-800">locate --requested-path</span>
                    </div>
                    
                    <h1 class="text-5xl font-light tracking-tighter text-gray-900">
                        404_<span class="text-green-500 font-bold">NULL</span><span class="cursor"></span>
                    </h1>
                    
                    <p class="mt-6 text-gray-500 text-sm leading-relaxed max-w-sm">
                        The requested sector does not exist or has been moved to the <span class="text-black font-bold">Shadow Vault</span>. 
                    </p>
                </div>

                <div class="pt-6 border-t border-gray-50">
                    <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-4">Automated Recovery Initiated...</p>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-xs font-bold px-5 py-2 border border-black hover:bg-black hover:text-white transition">Return Home</a>
                        <a href="/shop/" class="text-xs font-bold text-green-600 hover:underline">Access Shop_</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 flex justify-between items-center px-4">
            <div class="text-[9px] text-gray-400 uppercase font-mono">
                Redirecting in <span id="timer" class="text-black font-bold">10</span>s
            </div>
            <div class="text-[9px] text-gray-300 font-mono">
                [UUID: 0x-RECOVERY-ALPHA]
            </div>
        </div>
    </main>

    <script>
        // Smart Redirect Logic
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = "/shop/"; // হারানো ট্রাফিককে সরাসরি শপে পাঠাবে
            }
        }, 1000);
    </script>
</body>
</html>
