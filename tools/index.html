<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0x | System Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@300;500&display=swap');
        body { background: #020202; color: #00ff41; font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(15, 15, 15, 0.8); border: 1px solid rgba(0, 255, 65, 0.1); backdrop-filter: blur(10px); }
        .neon-btn { background: #00ff41; color: black; font-weight: bold; transition: 0.3s; }
        .neon-btn:hover { box-shadow: 0 0 20px rgba(0, 255, 65, 0.5); transform: scale(1.02); }
        .orbitron { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-20">

    <header class="max-w-4xl mx-auto mb-12">
        <a href="/" class="text-xs text-gray-500 hover:text-green-500"><< BACK_TO_STATION</a>
        <h1 class="orbitron text-4xl font-black mt-4 uppercase tracking-tighter text-white">SYSTEM_TOOLS</h1>
        <div class="h-1 w-20 bg-green-500 mt-2"></div>
    </header>

    <main class="max-w-4xl mx-auto space-y-8">
        
        <div class="glass-card p-8 rounded-3xl">
            <h2 class="orbitron text-xl mb-4 text-white">0x_Message_Encryptor</h2>
            <p class="text-gray-500 text-sm mb-6">গোপন মেসেজ পাঠান একদম ডিক্রিপ্ট করা অবস্থায়। শুধু মাত্র কি (Key) জানলেই পড়া সম্ভব।</p>
            
            <div class="space-y-4">
                <textarea id="msgInput" placeholder="Enter Message..." class="w-full bg-black/50 border border-gray-800 p-4 rounded-xl focus:border-green-500 outline-none h-32"></textarea>
                <div class="flex space-x-4">
                    <button onclick="process('enc')" class="neon-btn flex-1 py-3 rounded-xl">ENCRYPT</button>
                    <button onclick="process('dec')" class="border border-green-500/30 flex-1 py-3 rounded-xl hover:bg-green-500/10">DECRYPT</button>
                </div>
                <div id="msgOutput" class="p-4 bg-green-500/5 border border-green-500/20 rounded-xl break-all text-xs font-mono hidden text-white"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-card p-6 rounded-2xl opacity-50 border-dashed border-gray-800">
                <div class="text-xs text-gray-600 mb-1">Coming Soon</div>
                <div class="text-white font-bold">IP_LOOKUP_V2</div>
            </div>
            <div class="glass-card p-6 rounded-2xl opacity-50 border-dashed border-gray-800">
                <div class="text-xs text-gray-600 mb-1">Coming Soon</div>
                <div class="text-white font-bold">REFERRAL_TRACKER_PRO</div>
            </div>
        </div>
    </main>

    <script>
        function process(type) {
            const input = document.getElementById('msgInput').value;
            const output = document.getElementById('msgOutput');
            
            if(!input) return;

            if(type === 'enc') {
                const encrypted = btoa(input); // Basic Base64 Encryption
                output.innerText = "ENCRYPTED: " + encrypted;
            } else {
                try {
                    const decrypted = atob(input.replace("ENCRYPTED: ", ""));
                    output.innerText = "DECRYPTED: " + decrypted;
                } catch(e) {
                    output.innerText = "ERROR: Invalid Encrypted Data";
                }
            }
            output.classList.remove('hidden');
        }
    </script>
</body>
</html>
