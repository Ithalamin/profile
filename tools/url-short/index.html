<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Bypass | Shadow Shortener</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lzma-js/2.3.0/lzma-min.js"></script>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .terminal { background: rgba(0, 0, 0, 0.9); padding: 20px; border: 1px solid #00ff41; box-shadow: 0 0 20px #00ff41; width: 90%; max-width: 500px; }
        input { width: 100%; background: transparent; border: 1px solid #00ff41; color: #00ff41; padding: 10px; margin-top: 10px; outline: none; box-sizing: border-box; }
        button { width: 100%; background: #00ff41; color: #000; border: none; padding: 10px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        #loader { text-align: center; }
    </style>
</head>
<body>

<div class="terminal" id="mainContainer">
    <div id="ui">
        <h3>[ SHADOW_LINK_v2.0 ]</h3>
        <p>> STATUS: UNSTOPPABLE</p>
        <p>> DB_STATUS: NO_LOGS_MODE</p>
        <input type="text" id="urlInput" placeholder="ENTER LONG URL...">
        <button onclick="generateLink()">GENERATE SHADOW ID</button>
        <input type="text" id="resultUrl" class="hidden" readonly onclick="this.select()">
    </div>

    <div id="loader" class="hidden">
        <p id="statusText">BYPASSING FIREWALL...</p>
        <div id="progress">░░░░░░░░░░ 0%</div>
    </div>
</div>

<script>
    // ১. হ্যাকার স্টাইল রিডাইরেক্টর (লিঙ্কে ডেটা থাকলে কাজ করবে)
    window.onload = function() {
        const hash = window.location.hash.substring(1);
        if (hash) {
            document.getElementById('ui').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');
            
            // রিডাইরেক্ট প্রসেস শুরু
            decodeShadowLink(hash);
        }
    };

    // ২. লিঙ্ক জেনারেটর (Compression + Obfuscation)
    function generateLink() {
        const url = document.getElementById('urlInput').value;
        if(!url) return;

        LZMA.compress(url, 9, function(result) {
            const base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(result)))
                            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            
            const shortUrl = window.location.origin + window.location.pathname + "#" + base64;
            document.getElementById('resultUrl').value = shortUrl;
            document.getElementById('resultUrl').classList.remove('hidden');
            document.getElementById('urlInput').value = "";
        });
    }

    // ৩. রিডাইরেক্ট লজিক (The Income Gate)
    function decodeShadowLink(hash) {
        let p = 0;
        let interval = setInterval(() => {
            p += 20;
            document.getElementById('progress').innerText = "▓".repeat(p/10) + "░".repeat(10-p/10) + ` ${p}%`;
            if(p === 40) document.getElementById('statusText').innerText = "DECRYPTING SHADOW PATH...";
            if(p === 80) document.getElementById('statusText').innerText = "VALIDATING NODE...";
            
            if(p >= 100) {
                clearInterval(interval);
                try {
                    const binary = new Uint8Array(atob(hash.replace(/-/g, '+').replace(/_/g, '/'))
                                   .split('').map(c => c.charCodeAt(0)));
                    
                    LZMA.decompress(binary, function(result) {
                        if (result) {
                            // আপনার অ্যাফিলিয়েট/অ্যাড লিঙ্ক এখানে দিন (Income Hack)
                            // ইউজারকে সরাসরি গন্তব্যে না পাঠিয়ে একটি ইন্টারমিডিয়েট অ্যাড পেজে পাঠাবো
                            const finalDest = result;
                            window.location.href = `https://your-ad-network-link.com/?target=${btoa(finalDest)}`;
                        }
                    });
                } catch (e) { alert("BROKEN LINK"); }
            }
        }, 300);
    }
</script>
</body>
</html>
