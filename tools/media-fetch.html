<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0x | Media Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        :root {
            --bg-color: #0a0c10;
            --card-bg: rgba(30, 41, 59, 0.4);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        .light-theme {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .tool-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .input-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-fetch {
            background: #2563eb;
            transition: 0.3s;
        }

        .btn-fetch:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .preview-img {
            border-radius: 16px;
            border: 4px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <nav class="w-full max-w-2xl flex justify-between items-center mb-16">
        <a href="/" class="font-bold text-xl tracking-tight uppercase">0x_<span class="text-blue-600">Media</span></a>
        <div class="flex items-center space-x-6">
            <button onclick="toggleTheme()" class="p-2 rounded-full bg-slate-800 text-yellow-400 border border-slate-700" id="themeBtn">
                🌙
            </button>
            <a href="/shop/" class="text-sm font-semibold text-blue-600 italic">Access Vault</a>
        </div>
    </nav>

    <main class="w-full max-w-xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold mb-2">Thumbnail Downloader</h1>
            <p class="text-sm opacity-60">Extract Ultra-HD thumbnails from any video link.</p>
        </div>

        <div class="tool-card p-8 mb-8">
            <div class="space-y-6">
                <div>
                    <label class="text-xs font-bold uppercase tracking-widest text-blue-500 mb-2 block">Video URL</label>
                    <input type="text" id="videoUrl" placeholder="Paste YouTube link here..." 
                    class="input-box w-full p-4 rounded-2xl outline-none focus:border-blue-500 transition">
                </div>
                
                <button onclick="fetchThumbnail()" id="mainBtn" class="btn-fetch w-full py-4 rounded-2xl font-bold text-white text-lg">
                    Fetch Media
                </button>
            </div>

            <div id="resultArea" class="hidden mt-10 pt-8 border-t border-slate-700/50">
                <p class="text-xs font-bold opacity-50 mb-4 uppercase">Preview & Download</p>
                <img id="thumbPreview" src="" alt="Thumbnail" class="preview-img w-full mb-6">
                
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="downloadImg('hd')" class="py-3 bg-slate-800 rounded-xl text-xs font-bold hover:bg-slate-700">Download HD</button>
                    <button onclick="downloadImg('max')" class="py-3 bg-white text-black rounded-xl text-xs font-bold hover:bg-slate-200">Download 4K (Max)</button>
                </div>
            </div>
        </div>

        <div class="bg-gradient-to-r from-blue-900/20 to-transparent border border-blue-500/10 p-6 rounded-3xl flex items-center justify-between">
            <div>
                <h4 class="font-bold text-white text-sm">Automated Media Scripts?</h4>
                <p class="text-[11px] text-slate-500">Bulk download tools available in the vault.</p>
            </div>
            <a href="/shop/" class="text-xs font-bold text-blue-400 border border-blue-400/20 px-4 py-2 rounded-lg hover:bg-blue-400 hover:text-white transition">Visit Shop</a>
        </div>
    </main>

    <footer class="mt-auto py-10 opacity-30 text-[10px] tracking-[0.3em] font-mono">
        &copy; 2026 0X_MEDIA_EXTRACTOR // SYSTEM_STABLE
    </footer>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            body.classList.toggle('light-theme');
            btn.innerText = body.classList.contains('light-theme') ? '☀️' : '🌙';
        }

        function fetchThumbnail() {
            const url = document.getElementById('videoUrl').value;
            const result = document.getElementById('resultArea');
            const preview = document.getElementById('thumbPreview');
            const btn = document.getElementById('mainBtn');

            if(!url.includes('youtube.com') && !url.includes('youtu.be')) {
                alert("Please enter a valid YouTube URL.");
                return;
            }

            // Extract ID
            let videoId = "";
            if(url.includes('v=')) videoId = url.split('v=')[1].substring(0, 11);
            else videoId = url.split('/').pop();

            btn.innerText = "Extracting...";
            
            setTimeout(() => {
                const thumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                preview.src = thumbUrl;
                result.classList.remove('hidden');
                btn.innerText = "Fetch Media";
                
                // Shadow-Log: আপনি এখানে ইউজারের ক্লিক ডেটা ট্র্যাক করতে পারেন
                console.log("Media Extracted for ID: " + videoId);
            }, 800);
        }

        function downloadImg(type) {
            alert("Download starting... For batch downloads, visit our Premium Vault.");
            // আসল ডাউনলোড লজিক এখানে যুক্ত করা যায়
        }
    </script>
</body>
</html>
