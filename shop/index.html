<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite.Shop | Automated Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black dark:bg-black dark:text-white transition-colors duration-500">
    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-gray-100 dark:border-zinc-900 px-6 py-4 flex justify-between items-center">
        <div class="font-black text-xl tracking-tighter italic">ELITE.DEALS</div>
        <div class="flex space-x-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span>
            <span class="text-[10px] font-bold uppercase tracking-widest">System Live</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-2 py-8">
        <div id="product-container" class="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-4">
            {% for i in range(1, 13) %}
            <div class="bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 rounded-xl overflow-hidden flex flex-col justify-between shadow-sm">
                <div class="p-4 text-center">
                    <img id="p{{i}}-img" src="https://via.placeholder.com/150" class="h-32 w-full object-contain mb-2 dark:mix-blend-lighten">
                    <h3 id="p{{i}}-title" class="text-[11px] font-bold line-clamp-2 h-8 text-gray-700 dark:text-gray-300 uppercase tracking-tighter">Scanning Amazon...</h3>
                </div>
                <div class="p-3 bg-gray-50 dark:bg-zinc-800/50">
                    <div class="text-center mb-2">
                        <span id="p{{i}}-price" class="text-sm font-black text-indigo-600 dark:text-indigo-400">₹0,000</span>
                    </div>
                    <a id="p{{i}}-link" href="#" target="_blank" class="block w-full py-2 bg-black dark:bg-white text-white dark:text-black text-[10px] font-black rounded uppercase text-center tracking-widest">Get Deal</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
